name: Feature request
description: Propose a new input, output, or behaviour for the module.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do with the module today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: interface
    attributes:
      label: Proposed interface
      description: The variables, outputs, or resources you expect, written as HCL.
      render: hcl
      placeholder: |
        variable "example" {
          description = "..."
          type        = string
          default     = null
        }
    validations:
      required: true
  - type: dropdown
    id: submodule
    attributes:
      label: Where does it belong?
      options:
        - hub (main.tf, ram.tf, flow_logs.tf)
        - modules/network-routing (network account)
        - modules/vpc-attachment (spoke account)
        - advisory checks (checks.tf)
        - a new example
        - an integration suite
        - not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, such as a separate composition for VPN or peering, or wrapping the module.
  - type: checkboxes
    id: constraints
    attributes:
      label: Design constraints
      options:
        - label: The proposal keeps the ADR 0003 model intact (deny by default, spokes cannot classify their attachments, the network account owns domain assignment).
        - label: The proposal is backwards compatible, or the breaking change is called out above.
