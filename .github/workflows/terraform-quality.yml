name: terraform-quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every directory is validated on its own by the shared workflow, which runs
# `terraform validate`. No module here declares configuration_aliases (the
# earlier local workflow skipped validate for modules that did); a directory
# that needs a second provider belongs in examples/, where the aliases are
# declared in the root configuration.
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - modules/network-routing
          - modules/vpc-attachment
          - examples/minimal-hub
          - examples/segmented-domains
          - examples/spoke-attachment
          - examples/organization-share
    uses: hatan4ik/terraform-pipelines/.github/workflows/terraform-quality.yml@838da070a7e33ed2911ad3768ba3d00cccc9a5d9 # v0.1.0
    with:
      working_directory: ${{ matrix.directory }}
      check_docs: true
